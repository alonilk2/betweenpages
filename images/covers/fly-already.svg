  <polygon points="150,150 120,200 180,200" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <polygon points="150,200 130,240 170,240" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

  <text x="150" y="380" text-anchor="middle" fill="#C6F6D5" font-family="Arial, sans-serif" font-size="10">
